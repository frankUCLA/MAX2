<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#071018"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="MAX"/>
  <meta name="application-name" content="MAX"/>
  <meta name="description" content="MAX — consulta desde el teléfono"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="/imagen/images.png"/>
  <link rel="icon" href="/imagen/images.png"/>
  <title>MAX</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="max-theme.js"></script>
  <script src="max-pwa.js"></script>
  <style>
    :root {
      --ink: #f4f7fb;
      --muted: #8b9bb0;
      --line: rgba(255,255,255,0.10);
      --panel: rgba(12, 20, 32, 0.72);
      --panel-solid: #0c1420;
      --field: rgba(255,255,255,0.045);
      --accent: #2f6fed;
      --accent-deep: #1d4ed8;
      --ok: #34d399;
      --err: #fb7185;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: Manrope, system-ui, sans-serif;
      background: #071018;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      min-height: 100dvh;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding:
        calc(18px + var(--safe-top))
        22px
        calc(22px + var(--safe-bottom));
    }

    .app::before,
    .app::after {
      content: "";
      position: absolute;
      inset: auto;
      pointer-events: none;
      z-index: 0;
    }
    .app::before {
      width: 420px;
      height: 420px;
      top: -160px;
      left: -120px;
      background: radial-gradient(circle, rgba(47,111,237,0.35), transparent 68%);
      filter: blur(8px);
      animation: drift 12s ease-in-out infinite alternate;
    }
    .app::after {
      width: 380px;
      height: 380px;
      right: -140px;
      bottom: -120px;
      background: radial-gradient(circle, rgba(56,189,248,0.14), transparent 70%);
      animation: drift 14s ease-in-out infinite alternate-reverse;
    }

    @keyframes drift {
      from { transform: translate3d(0,0,0) scale(1); }
      to { transform: translate3d(18px, 12px, 0) scale(1.06); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes softPulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(100%, 420px);
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: rise 0.55s ease both;
    }
    .topbar-mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: Outfit, Manrope, sans-serif;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-size: 1.05rem;
    }
    .topbar-mark img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      padding: 4px;
      border: 1px solid var(--line);
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-pill i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 3px rgba(52,211,153,0.18);
      animation: softPulse 2.2s ease infinite;
    }
    .status-pill.is-offline i { background: var(--err); box-shadow: 0 0 0 3px rgba(251,113,133,0.18); }

    .hero {
      text-align: left;
      padding-top: 8px;
      animation: rise 0.65s ease 0.05s both;
    }
    .hero-kicker {
      margin: 0 0 10px;
      color: #9db0c7;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .hero h1 {
      margin: 0;
      font-family: Outfit, Manrope, sans-serif;
      font-size: clamp(2.35rem, 9vw, 3rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
      font-weight: 800;
    }
    .hero h1 span {
      display: block;
      color: #c5d4e8;
      font-weight: 600;
      font-size: 0.42em;
      letter-spacing: -0.02em;
      margin-top: 10px;
      line-height: 1.25;
      max-width: 16ch;
    }

    .panel {
      margin-top: auto;
      background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 22px 18px 18px;
      backdrop-filter: blur(18px);
      box-shadow:
        0 24px 60px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.08);
      animation: rise 0.7s ease 0.12s both;
    }

    .panel-head {
      margin-bottom: 18px;
    }
    .panel-head h2 {
      margin: 0 0 6px;
      font-family: Outfit, sans-serif;
      font-size: 1.25rem;
      letter-spacing: -0.03em;
    }
    .panel-head p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #a8b7cb;
    }
    .field input {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.10);
      background: var(--field);
      color: var(--ink);
      border-radius: 16px;
      padding: 15px 16px;
      font-size: 1.02rem;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .field input::placeholder { color: #6b7c92; }
    .field input:focus {
      border-color: rgba(47,111,237,0.75);
      background: rgba(255,255,255,0.06);
      box-shadow: 0 0 0 4px rgba(47,111,237,0.16);
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 15px 16px;
      font-family: Outfit, Manrope, sans-serif;
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease, filter .15s ease;
    }
    .btn:active { transform: scale(0.985); }
    .btn:disabled { opacity: 0.55; cursor: wait; }
    .btn-primary {
      margin-top: 6px;
      color: #fff;
      background: linear-gradient(180deg, #3b82f6 0%, var(--accent-deep) 100%);
      box-shadow: 0 12px 28px rgba(37,99,235,0.35);
    }
    .btn-ghost {
      margin-top: 10px;
      color: #dbe7f5;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
      display: none;
    }

    .msg {
      min-height: 1.2rem;
      margin-top: 12px;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--err); }

    .install-note {
      margin: 14px 0 0;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.08);
      color: #8091a8;
      font-size: 0.8rem;
      line-height: 1.45;
      text-align: center;
    }
    body.is-standalone .install-note,
    body.is-standalone .btn-ghost { display: none !important; }

    .fineprint {
      text-align: center;
      color: #5d6f86;
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      animation: rise 0.7s ease 0.2s both;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="shell">
      <div class="topbar">
        <div class="topbar-mark">
          <img src="imagen/images.png" alt="">
          <span>MAX</span>
        </div>
        <div class="status-pill" id="netPill"><i></i><span>Conectando</span></div>
      </div>

      <header class="hero">
        <p class="hero-kicker">App de consulta</p>
        <h1>
          MAX
          <span>Control del negocio en tu bolsillo</span>
        </h1>
      </header>

      <section class="panel" aria-label="Inicio de sesión">
        <div class="panel-head">
          <h2>Entrar</h2>
          <p>Usuario y contraseña del sistema. Sin clave no hay acceso.</p>
        </div>

        <form id="loginForm" autocomplete="on">
          <div class="field">
            <label for="usuario">Usuario</label>
            <input id="usuario" name="usuario" type="text" autocomplete="username" required placeholder="Tu usuario" inputmode="text">
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary" id="loginBtn">Continuar</button>
          <button type="button" class="btn btn-ghost" id="installBtn">Instalar app en el teléfono</button>
          <div class="msg" id="msg" role="status"></div>
        </form>

        <p class="install-note" id="installHint">
          Para dejarla como app: en Chrome → menú → <strong>Instalar aplicación</strong>.
        </p>
      </section>

      <p class="fineprint" id="pageUrl"></p>
    </div>
  </div>

  <script>
    (function () {
      const msg = document.getElementById('msg');
      const form = document.getElementById('loginForm');
      const btn = document.getElementById('loginBtn');
      const installBtn = document.getElementById('installBtn');
      const netPill = document.getElementById('netPill');
      const pageUrl = document.getElementById('pageUrl');

      const standalone = window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
      if (standalone) document.body.classList.add('is-standalone');

      pageUrl.textContent = standalone ? 'MAX app' : (location.host || 'MAX');

      function isMobile() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent || '');
      }

      function setMsg(text, ok) {
        msg.textContent = text || '';
        msg.className = 'msg ' + (ok ? 'ok' : 'err');
      }

      function setNet(ok, label) {
        netPill.classList.toggle('is-offline', !ok);
        netPill.querySelector('span').textContent = label;
      }

      fetch('/api/status', { credentials: 'include', cache: 'no-store' })
        .then((r) => r.json())
        .then((data) => {
          const live = !!(data && data.servidor);
          setNet(live, live ? (data.bd ? 'En línea' : 'Sin base de datos') : 'Sin servidor');
          if (!data || !data.usuario) return;
          const rol = String(data.rol || '').toLowerCase();
          if (rol.indexOf('admin') >= 0) location.replace('admin.html');
          else if (rol.indexOf('caja') >= 0) {
            if (isMobile()) setMsg('En el teléfono solo entra el administrador (consulta).', false);
            else location.replace('caja.html');
          }
        })
        .catch(() => setNet(false, 'Sin servidor'));

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const usuario = document.getElementById('usuario').value.trim();
        const password = document.getElementById('password').value.trim();
        if (!usuario || !password) {
          setMsg('Escribe usuario y contraseña', false);
          return;
        }
        btn.disabled = true;
        setMsg('Validando…', true);
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            credentials: 'include',
            cache: 'no-store',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuario, password })
          });
          const data = await res.json();
          if (!data.ok) {
            setMsg(data.error || 'Usuario o contraseña incorrectos', false);
            btn.disabled = false;
            return;
          }
          const rol = String(data.rol || '').toLowerCase();
          setMsg('Bienvenido', true);
          if (rol.indexOf('admin') >= 0) {
            location.href = 'admin.html';
          } else if (rol.indexOf('caja') >= 0) {
            if (isMobile()) {
              setMsg('En el teléfono solo el administrador puede consultar.', false);
              btn.disabled = false;
            } else {
              location.href = 'caja.html';
            }
          } else {
            setMsg('Rol no reconocido', false);
            btn.disabled = false;
          }
        } catch (_) {
          setMsg('No hay conexión con MAX', false);
          btn.disabled = false;
        }
      });

      let deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (!standalone) installBtn.style.display = 'block';
      });
      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.style.display = 'none';
        setMsg('App lista en tu pantalla de inicio', true);
      });
    })();
  </script>
</body>
</html>
