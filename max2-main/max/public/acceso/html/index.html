<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#2563eb"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="MAX"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="/imagen/images.png"/>
  <title>MAX — Iniciar sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <script src="max-theme.js"></script>
  <script src="max-ui-dialogs.js?v=209"></script>
  <script src="max-pwa.js"></script>
</head>
<body>
  <div id="app" class="container">
    <aside class="login-brand" aria-hidden="true">
      <img class="login-brand-img" src="imagen/images.png" alt="MAX">
    </aside>
    <main class="card">
      <header class="header" style="display:none;">
        <h1>MAX</h1>
        <div id="statusDisplay" class="status-msg">Cargando estado...</div>
      </header>
      <section id="loginSection" class="section">
        <h2>Acceso al sistema</h2>
        <p class="login-sub">Administración y puntos de venta</p>
        <form id="loginForm" autocomplete="on">
          <div class="field">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="Usuario" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
          </div>
          <button type="submit" id="loginBtn" class="btn primary">Entrar</button>
          <div id="loginMsg" class="msg"></div>
        </form>
      </section>
    </main>
  </div>
  <script src="cliente.js?v=216"></script>
</body>
</html>
